<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工作台</title>
  <link rel="stylesheet" href="style.css?v=tui-only-26">
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
</head>
<body>
  <header class="topbar">
    <button id="sidebar-toggle" class="topbar-brand" type="button" title="收起侧边栏" aria-label="收起侧边栏"><span class="brand-mark">π</span><strong>工作台</strong></button>
    <div class="topbar-tools"><select id="theme-select" aria-label="皮肤模式"><option value="system">跟随系统</option><option value="light">浅色模式</option><option value="dark">深色模式</option></select><div id="stats" class="stats"></div></div>
  </header>
  <div id="workspace-shell">
    <aside id="app-sidebar" class="app-sidebar">
      <div class="sidebar-nav" role="tablist" aria-label="模块切换">
        <button id="module-tasks" class="sidebar-nav-item active" role="tab"><span>▣</span><span>任务管理</span></button>
        <button id="module-session" class="sidebar-nav-item" role="tab"><span>◌</span><span>会话管理</span></button>
      </div>
      <div id="task-sidebar" class="sidebar-panel"><button id="sidebar-new-task" class="sidebar-action"><span class="group-icon">＋</span><span class="group-label">新建任务</span></button><div id="task-groups" class="task-groups"></div></div>
      <div id="session-sidebar" class="sidebar-panel hidden"><div id="session-tree"></div></div>
    </aside>
    <main id="workspace-main">
      <section class="toolbar" id="task-toolbar"><select id="sort"><option value="updated">最近更新</option><option value="created">创建时间（新→旧）</option><option value="deadline">Deadline（近→远）</option></select><input id="search" type="search" placeholder="搜索标题或内容"></section>
      <section id="task-list" class="module-view"></section>
      <section id="session-view" class="module-view hidden">
        <div class="session-layout"><div class="session-main">
          <header class="session-header"><div class="session-context"><span class="session-context-icon">π</span><div><button id="session-title" class="session-title-button" type="button">选择一个子会话</button></div><div id="session-description-panel" class="session-description-panel hidden"><div id="session-description-text"></div></div></div><div class="session-controls"><select id="session-task-select"><option value="">选择一个任务会话</option></select><button id="session-restart" title="重新连接当前终端">重新连接</button></div></header>
          <div id="session-terminal" class="session-terminal" aria-label="pi 终端"><div class="terminal-empty">从左侧选择一个会话以打开 pi 会话</div></div>
        </div></div>
      </section>
    </main>
  </div>
  <div id="modal-root"></div><div id="toast-root"></div>
  <script type="module" src="app.js?v=tui-only-34"></script>
</body>
</html>
